<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Zeca e a Aventura dos Números</title>
<meta name="theme-color" content="#26b562">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zeca">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--ink:#243b53;--paper:#fffef7;--grid:#c6dcf3;--blue:#2f80ed;--green:#1fb866;--orange:#ff9f1c;--red:#e5484d;--purple:#7c5cff;--yellow:#ffd23f;--cw:56px;--ch:62px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:"Chalkboard SE","Comic Neue","Comic Sans MS","Segoe Print",system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,#7fe0a6 0%,#43c97d 45%,#26b562 100%) fixed;user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow-x:hidden}
button{font:inherit;cursor:pointer;border:0;border-radius:18px;padding:10px 18px;min-height:52px;color:#fff;background:var(--blue);box-shadow:0 5px 0 rgba(0,0,0,.18);transition:transform .08s}
button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
button.g{background:var(--green)}button.o{background:var(--orange)}button.p{background:var(--purple)}button.r{background:var(--red)}button.y{background:var(--yellow);color:var(--ink)}button.w{background:#fff;color:var(--ink)}
button[disabled]{opacity:.45;pointer-events:none}
h1,h2,h3{margin:.3em 0}
#top{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);position:sticky;top:0;z-index:20;flex-wrap:wrap;border-bottom:6px solid #ffdf00;box-shadow:0 6px 0 #1b56c7}
#top button{min-height:44px;padding:4px 12px}
.chip{background:#fff;border-radius:999px;padding:6px 12px;font-weight:700;box-shadow:inset 0 0 0 2px #e3eefb;white-space:nowrap}
.xpbar{display:inline-block;width:60px;height:8px;background:#e3eefb;border-radius:6px;vertical-align:middle;margin-left:6px;overflow:hidden}.xpbar i{display:block;height:100%;background:var(--green);width:0}
.spacer{flex:1}
#stage{padding:14px;max-width:1100px;margin:0 auto}
.card{background:#fff;border-radius:24px;padding:16px 18px;box-shadow:0 6px 0 rgba(36,59,83,.1)}
.mascot{display:inline-block;position:relative;font-size:76px;line-height:1;animation:bob 2.4s ease-in-out infinite}
.mascot .acc{position:absolute;top:-26px;left:50%;transform:translateX(-50%);font-size:44px}
.mascot.sm{font-size:48px}.mascot.sm .acc{font-size:28px;top:-16px}
@keyframes bob{50%{transform:translateY(-6px)}}
.hero{display:flex;gap:18px;align-items:center;margin:20px 0 10px}
.hero p{margin:0;font-size:20px}
.mission{background:linear-gradient(135deg,#7c5cff,#2f80ed);color:#fff;border-radius:26px;padding:18px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:0 7px 0 rgba(36,59,83,.2)}
.mission h2{margin:0}.mission p{margin:4px 0 0;opacity:.95}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:14px;margin-top:16px}
.tile{background:#fff;border-radius:24px;padding:18px;text-align:center;cursor:pointer;box-shadow:0 6px 0 rgba(36,59,83,.12);transition:transform .1s;border:0;color:var(--ink);font-size:20px;min-height:140px}
.tile:active{transform:translateY(3px)}.tile .e{font-size:48px;display:block}.tile small{display:block;font-size:14px;opacity:.75;margin-top:4px}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:14px}
.lv{background:#fff;border-radius:24px;padding:16px;text-align:center;box-shadow:0 6px 0 rgba(36,59,83,.12)}
.lv.locked{filter:grayscale(1);opacity:.6}.lv .n{font-size:40px;font-weight:700}.lv .med{font-size:34px;min-height:42px}
/* notebook */
.nbgrid{display:grid;grid-template-columns:1fr 330px;gap:14px;align-items:start}
@media(max-width:860px){.nbgrid{grid-template-columns:1fr}:root{--cw:46px;--ch:54px}}
.paper{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;border-radius:14px;box-shadow:0 6px 0 rgba(36,59,83,.15);position:relative;padding:14px 18px 18px 62px;min-height:420px}
.paper::before{content:"";position:absolute;left:44px;top:0;bottom:0;width:3px;background:#f4a3a8}
.paper::after{content:"";position:absolute;left:10px;top:18px;bottom:18px;width:14px;background:radial-gradient(circle,#9db4cf 5px,transparent 6px) 0 0/14px 40px repeat-y}
.ptitle{font-size:16px;opacity:.7;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.prob{font-size:30px;font-weight:700;margin:4px 0 10px;color:var(--purple)}
.vwrap{display:inline-block;margin:6px 0}.dwrap{display:flex;align-items:flex-start;margin:6px 0}
.vrow{display:flex}
.vrow.sep{height:5px;background:var(--ink);border-radius:3px;margin:4px 0 4px var(--cw)}.vrow.sep .cell{display:none}
.vrow.carry .cell{height:34px}
.cell{width:var(--cw);height:var(--ch);display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:700;border-radius:10px}
.cell.blank{visibility:hidden}
.cell.in,.cell.hid{background:#fff;border:3px dashed #9db4cf}
.cell.hid{border-color:transparent;background:transparent}
.cell.hid.cur{border:3px dashed var(--orange);background:#fff}
.cell.act{border-color:#6fa8f5}
.cell.cur{border-color:var(--blue);box-shadow:0 0 0 4px rgba(47,128,237,.28);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(47,128,237,.12)}}
.cell.ok{color:var(--green);border:3px solid #bfe8d0;background:#f1fff7}
.cell.hid.ok{border-color:transparent;background:transparent;color:var(--ink)}
.cell.assist{color:var(--purple);border:3px solid #d9ccff;background:#f7f3ff}
.cell.bad{border-color:var(--red)!important;color:var(--red)}
.cell.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.cell.sm{height:34px;font-size:22px;color:var(--orange)}
.cell.strike{text-decoration:line-through;text-decoration-thickness:4px;text-decoration-color:var(--red);color:#9aa9bd}
.cell.ph{color:#9aa9bd}.cell.sign{font-size:34px;color:var(--purple)}
.cell.chave{border-right:4px solid var(--ink);border-radius:0}
.dright{margin-left:0}.dv{border-bottom:4px solid var(--ink);padding-left:12px;height:var(--ch);display:flex;align-items:center}
.dv .cell{width:auto;padding:0 6px;color:var(--ink)}
.qrow{display:flex;padding-left:12px;margin-top:4px}
.side{display:flex;flex-direction:column;gap:12px}
.coach{display:flex;gap:10px;align-items:flex-start}
.bubble{background:#fff;border-radius:20px;padding:12px 14px;font-size:19px;line-height:1.35;position:relative;box-shadow:0 4px 0 rgba(36,59,83,.1);flex:1;min-height:70px}
.fb{min-height:26px;color:var(--green);font-weight:700;font-size:17px;margin-top:4px}
#pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
#pad button{font-size:30px;min-height:64px;padding:0}
.dots{display:flex;gap:6px;flex-wrap:wrap}.dot{width:16px;height:16px;border-radius:50%;background:#d6e3f2}.dot.d{background:var(--green)}.dot.c{background:var(--blue);box-shadow:0 0 0 3px rgba(47,128,237,.3)}
/* overlay */
#overlay{position:fixed;inset:0;background:rgba(20,30,60,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
#overlay[hidden]{display:none}
.modal{background:#fff;border-radius:28px;padding:22px 26px;max-width:640px;width:100%;max-height:92vh;overflow:auto;text-align:center;animation:popin .25s}
@keyframes popin{from{transform:scale(.85);opacity:0}}
.modal .big{font-size:48px;letter-spacing:4px}.modal p{font-size:19px;line-height:1.4}.modal .ex{font-size:20px;text-align:left;line-height:1.5;background:#f4f9ff;border-radius:16px;padding:12px 16px;margin:10px 0}
.modal button{margin:8px 6px 0}
.vis{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:10px 0}.bag{border:3px solid #6fa8f5;border-radius:14px;padding:6px;display:flex;flex-wrap:wrap;gap:3px;max-width:130px;justify-content:center;background:#f4f9ff}.bag.rest{border-style:dashed;border-color:var(--orange)}.bag i{width:14px;height:14px;border-radius:50%;background:var(--blue);display:block}.bag.rest i{background:var(--orange)}
.arr{display:grid;gap:4px;justify-content:center}.arr i{width:20px;height:20px;border-radius:50%;background:var(--blue);display:block}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:99;overflow:hidden}.confetti span{position:absolute;top:-40px;animation:fall 2.4s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
#toast div{background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;animation:popin .25s;box-shadow:0 4px 12px rgba(0,0,0,.25)}
/* facts */
.fcard{background:#fff;border-radius:28px;padding:20px;text-align:center;box-shadow:0 6px 0 rgba(36,59,83,.12)}
.fq{font-size:68px;font-weight:700;color:var(--purple)}.fa{font-size:60px;font-weight:700;min-height:76px;border-bottom:5px dashed #9db4cf;display:inline-block;min-width:180px;color:var(--ink)}
.tbar{height:14px;background:#e3eefb;border-radius:8px;overflow:hidden;margin:10px auto;max-width:520px}.tbar i{display:block;height:100%;background:var(--green);width:100%}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}@media(max-width:700px){.fgrid{grid-template-columns:1fr}}
.map{display:grid;grid-template-columns:repeat(11,1fr);gap:3px;font-size:13px;text-align:center}.map b{background:#eef4fb;border-radius:6px;padding:4px 0}.map span{border-radius:6px;padding:5px 0;color:#fff;font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}.chips button{min-height:46px;min-width:46px;padding:4px 10px;background:#fff;color:var(--ink);box-shadow:inset 0 0 0 3px #cfe0f3}.chips button.on{background:var(--purple);color:#fff;box-shadow:none}
/* balloons */
.bfield{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin:30px 0}
.balloon{width:110px;height:136px;border-radius:50% 50% 48% 48%;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700;color:#fff;cursor:pointer;position:relative;animation:float 2.2s ease-in-out infinite;box-shadow:inset -10px -10px 0 rgba(0,0,0,.12);border:0}
.balloon::after{content:"";position:absolute;bottom:-26px;left:50%;width:2px;height:28px;background:#8895a7}
.balloon.pop{animation:pop .3s forwards}.balloon.wob{animation:shake .4s}
@keyframes float{50%{transform:translateY(-14px)}}@keyframes pop{to{transform:scale(1.6);opacity:0}}
/* exam */
.qcard{background:#fff;border-radius:24px;padding:18px;box-shadow:0 6px 0 rgba(36,59,83,.12)}
.qtext{font-size:28px;font-weight:700;margin-bottom:10px}
.fld{display:inline-flex;flex-direction:column;align-items:center;margin:6px 10px;font-size:15px}.fld div{min-width:130px;height:68px;border:4px dashed #9db4cf;border-radius:14px;font-size:40px;font-weight:700;display:flex;align-items:center;justify-content:center;background:#fff}.fld.cur div{border-color:var(--blue);box-shadow:0 0 0 4px rgba(47,128,237,.25)}
canvas.scratch{width:100%;height:150px;background:#fffef7;border-radius:14px;box-shadow:inset 0 0 0 3px #cfe0f3;touch-action:none}
.rv{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:8px 10px;border-radius:14px;margin:6px 0}.rv.ok{background:#effcf4}.rv.no{background:#fff6e8}
.small{font-size:15px;opacity:.8}

.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;min-height:260px}.pcol{width:min(30%,170px);text-align:center}.pcol.me .pbar{outline:4px solid var(--purple)}.pname{font-weight:700;font-size:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pval{font-size:18px;margin-bottom:4px}.pbar{border-radius:16px 16px 0 0;display:flex;align-items:flex-start;justify-content:center;font-size:44px;padding-top:8px}
table.st{border-collapse:collapse;width:100%;font-size:16px}table.st td,table.st th{padding:6px 8px;border-bottom:1px solid #e3eefb;text-align:left}
</style>
</head>
<body>
<header id="top">
  <button class="w" id="btnHome" title="Início">🏠</button>
  <div class="chip">⭐ <b id="hStars">0</b></div>
  <div class="chip">🪙 <b id="hCoins">0</b></div>
  <div class="chip">Nv <b id="hLvl">1</b><span class="xpbar"><i id="hXp"></i></span></div>
  <div class="chip" id="hCombo" style="display:none">🔥 ×<b>0</b></div>
  <div class="spacer"></div>
  <div class="chip" id="hTime">⏱ 00:00</div>
  <button class="w" id="btnSound" title="Sons">🔊</button>
  <button class="w" id="btnVoice" title="Voz">🗣️</button>
</header>
<main id="stage"></main>
<div id="overlay" hidden></div>
<div id="toast"></div>

<script>
'use strict';
/* ============ utilidades ============ */
const $=s=>document.querySelector(s);
const range=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[rnd(0,a.length-1)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const digs=n=>String(n).split('').map(Number);
const fmtT=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function h(tag,props,...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(props||{})){if(k==='class')e.className=v;else if(k==='html')e.innerHTML=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v);}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c));}return e;}
const stage=$('#stage');
let running=false;

/* ============ estado e armazenamento (somente neste aparelho) ============ */
const IDX='zeca-math-idx',PK='zeca-math-parent';
const keyOf=id=>id==='p1'?'zeca-math-v1':'zeca-math-v1-'+id;
function rd(k){try{const r=localStorage.getItem(k);return r?JSON.parse(r):null;}catch(e){return null;}}
function wr(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
let IX=rd(IDX)||{active:'p1',ids:['p1']};
const KEY=keyOf(IX.active);let NOSAVE=false;
const mkLv=()=>range(0,3).map(()=>({done:false,best:0,tries:0}));
function defaults(){return{id:IX.active,name:'',stars:0,coins:0,spent:0,xp:0,owned:[],equip:'',sound:true,voice:false,lvl:{mult:mkLv(),div:mkLv(),add:mkLv(),sub:mkLv()},facts:{},stats:{},errKinds:{},ms:0,t:{ex:0,combo:0,balloons:0,exams:0,bestExam:0,missions:0},trophies:[],exams:[],sessions:[]};}
let S=Object.assign(defaults(),rd(KEY)||{});
S.lvl.add=S.lvl.add||mkLv();S.lvl.sub=S.lvl.sub||mkLv();
const SES={t:Date.now(),ok:0,err:0,c0:S.coins+S.spent,s0:S.stars};
function save(){if(NOSAVE)return;try{if(sessionSec>=5||SES.ok+SES.err>0){const e={t:SES.t,sec:sessionSec,ok:SES.ok,err:SES.err,coins:S.coins+S.spent-SES.c0,stars:S.stars-SES.s0};const a=S.sessions;if(a.length&&a[a.length-1].t===SES.t)a[a.length-1]=e;else a.push(e);if(a.length>30)a.splice(0,a.length-30);}localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});window.addEventListener('pagehide',save);
let combo=0,sessionSec=0;

/* ============ som e voz ============ */
let AC;function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d=.12,type='sine',v=.15,when=0){if(!S.sound)return;const a=ac();if(!a)return;try{const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,a.currentTime+when);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+when+d);o.connect(g);g.connect(a.destination);o.start(a.currentTime+when);o.stop(a.currentTime+when+d);}catch(e){}}
const SFX={ok(){tone(660,.1);tone(880,.15,'sine',.15,.09)},oops(){tone(300,.18,'triangle',.12);tone(260,.2,'triangle',.1,.12)},tap(){tone(500,.04,'square',.03)},win(){[523,659,784,1047].forEach((f,i)=>tone(f,.22,'sine',.15,i*.12))},pop(){tone(900,.08,'square',.07);tone(450,.1,'square',.05,.05)}};
const cleanTxt=t=>String(t).replace(/<br\s*\/?>/gi,'. ').replace(/<[^>]+>/g,'').replace(/×/g,' vezes ').replace(/÷/g,' dividido por ').replace(/−/g,' menos ').replace(/\+/g,' mais ').replace(/=/g,' é igual a ').replace(/→/g,', ').replace(/[“”"]/g,'').replace(/\s+/g,' ');
const ptVoices=()=>{try{return speechSynthesis.getVoices().filter(v=>/^pt[-_]BR$/i.test(v.lang));}catch(e){return[];}};
function voiceScore(v){const n=v.name.toLowerCase();let sc=0;if(/natural|neural|online|aprimorad|enhanced|premium|siri/.test(n))sc+=6;if(/google/.test(n))sc+=3;if(/francisca|luciana|maria|vit[oó]ria|thalita|camila|fernanda|joana|giovanna/.test(n))sc+=2;if(/daniel|felipe|antonio|ant[oô]nio|ricardo|jorge/.test(n))sc-=2;return sc;}
function pickVoice(){const L=ptVoices();if(!L.length)return null;if(S.voiceName){const f=L.find(v=>v.name===S.voiceName);if(f)return f;}return L.slice().sort((x,y)=>voiceScore(y)-voiceScore(x))[0];}
let warnedVoice=false;
function speak(t,kid){if(!('speechSynthesis' in window))return false;const v=pickVoice();
  if(!v){if(!warnedVoice){warnedVoice=true;toast('Este aparelho não tem voz em português do Brasil: a explicação aparece só escrita.');}return false;}
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(cleanTxt(t));u.voice=v;u.lang=v.lang;u.pitch=kid?1.12:1;u.rate=kid?.88:.95;u.volume=1;speechSynthesis.speak(u);return true;}catch(e){return false;}}
function say(t){if(S.voice)speak(t,false);}
function sayKid(t){if(S.sound)speak(t,true);}
const replayBtn=t=>h('button',{class:'o',onclick:()=>sayKid(t)},'🔊 Ouvir o Zeca de novo');
function factSpeech(f,r){const op=f.op,p=valF(f),sp=op?`${f.a} ${op==='+'?'mais':'menos'} ${f.b} é ${p}.`:`${f.a} vezes ${f.b} é ${p}.`;const help=op==='+'?addHelp(f.a,f.b):op==='-'?subHelp(f.a,f.b):factHelp(f.a,f.b);return(r.timeout?'O tempo acabou, mas tudo bem. Vamos aprender juntos. ':'Quase! Vamos aprender juntos. ')+sp+' '+help+' Repita comigo: '+sp;}
function confetti(n=40){const box=h('div',{class:'confetti'});document.body.append(box);const em=['🎉','⭐','✨','🎊','💫','🌟'];for(let i=0;i<n;i++)box.append(h('span',{style:`left:${Math.random()*100}vw;animation-delay:${Math.random()*.7}s;font-size:${18+Math.random()*22}px`},em[i%em.length]));setTimeout(()=>box.remove(),3400);}
function toast(t){const box=$('#toast');const d=h('div',{},t);box.append(d);setTimeout(()=>d.remove(),3000);}

/* ============ cabeçalho ============ */
const lvlOf=xp=>1+Math.floor(xp/100);
function updHeader(){$('#hStars').textContent=S.stars;$('#hCoins').textContent=S.coins;$('#hLvl').textContent=lvlOf(S.xp);$('#hXp').style.width=(S.xp%100)+'%';const c=$('#hCombo');c.style.display=combo>=2?'':'none';c.querySelector('b').textContent=combo;$('#btnSound').textContent=S.sound?'🔊':'🔇';$('#btnVoice').style.opacity=S.voice?1:.45;}
function addXp(n){const before=lvlOf(S.xp);S.xp+=n;if(lvlOf(S.xp)>before){confetti(30);SFX.win();toast(`🎉 O Zeca subiu para o nível ${lvlOf(S.xp)}!`);}updHeader();}
setInterval(()=>{if(document.hidden)return;sessionSec++;S.ms+=1000;$('#hTime').textContent='⏱ '+fmtT(sessionSec);if(sessionSec%10===0)save();},1000);
$('#btnSound').onclick=()=>{S.sound=!S.sound;save();updHeader();};
$('#btnVoice').onclick=()=>{S.voice=!S.voice;save();updHeader();if(S.voice)say('Olá! Eu vou ler as perguntas para você.');};

function genMult(L){
  for(let t=0;t<300;t++){let a,b;
    if(L===1){b=rnd(2,4);const m=Math.floor(9/b);a=rnd(1,m)*10+rnd(1,m);}
    else if(L===2){b=rnd(2,9);a=rnd(12,99);}
    else if(L===3){b=rnd(2,9);a=rnd(101,499);}
    else{a=rnd(12,49);b=rnd(12,29);}
    if((L===2||L===3)&&!digs(a).some(d=>d*b>=10))continue;

/* ---- multiplicação armada (método tradicional) ---- */
function buildMult(A,B){
  const ad=digs(A),bd=digs(B),n=ad.length,m=bd.length,total=A*B,tl=String(total).length;
  const W=Math.max(n+m,tl)+1,rows=[],steps=[];
  const mk=cls=>{const r={cls,cells:Array.from({length:W},()=>({k:'blank'}))};rows.push(r);return r;};
  const P=[];
  for(let j=0;j<m;j++){const bj=bd[m-1-j];let c=0;const cols=[];
    for(let i=0;i<n;i++){const ai=ad[n-1-i],t=ai*bj+c;cols.push({ai,bj,c,t,dg:t%10,out:Math.floor(t/10),last:i===n-1});c=Math.floor(t/10);}
    P.push({j,bj,cols,val:A*bj});}
  const crow=[];
  for(let j=m-1;j>=0;j--)if(P[j].cols.some(c=>c.out>0&&!c.last))crow[j]=mk('carry');
  const rA=mk('');ad.forEach((d,i)=>rA.cells[W-n+i]={k:'fixed',v:d});
  const rB=mk('');bd.forEach((d,i)=>rB.cells[W-m+i]={k:'fixed',v:d});rB.cells[W-m-1]={k:'sign',v:'×'};
  mk('sep');

  for(const p of P){const r=prow[p.j];
    p.cols.forEach((c,i)=>{
      const col=W-1-p.j-i,id=`m${p.j}_${i}`,cr=c.c?` + ${c.c}`:'';
      r.cells[col]={k:'in',id};
      const intro=(p.j>0&&i===0)?`Agora multiplicamos pelo ${p.bj} (das dezenas) — por isso começamos com um 0. `:'';
      const q1=c.last&&c.out>0?`Última coluna! Calcule ${c.ai} × ${c.bj}${cr} e escreva o resultado inteiro, começando pela unidade.`:(c.t<10?`Quanto é ${c.ai} × ${c.bj}${cr}?`:`Calcule ${c.ai} × ${c.bj}${cr}. Escreva só o algarismo da unidade; o resto "vai" para a coluna ao lado.`);
      steps.push({kind:'mdig',cells:[id],exp:String(c.dg),prompt:intro+q1,short:`${c.ai} × ${c.bj}${cr} = ?`,
        ok:`${c.ai} × ${c.bj}${cr} = ${c.t}`+(c.out>0&&!c.last?` → escreve ${c.dg} e vai ${c.out}`:''),
        help1:factHelp(c.ai,c.bj)+(c.c?` Depois some o vai-um ${c.c}.`:''),
        help2:`<b>${c.ai} × ${c.bj} = ${c.ai*c.bj}</b>`+(c.c?`; mais o vai-um ${c.c}: <b>${c.t}</b>`:'')+`. `+(c.out>0&&!c.last?`O ${c.dg} fica aqui e o ${c.out} "vai" para a próxima coluna. `:(c.last&&c.out>0?`Como é a última coluna, escrevemos o número todo: ${c.dg} aqui e ${c.out} ao lado. `:''))+`Escreva <b>${c.dg}</b>.`,
        vis:{type:'array',a:c.ai,b:c.bj}});
      if(c.out>0&&!c.last){const cid=`c${p.j}_${i}`;crow[p.j].cells[W-2-i]={k:'in',id:cid,cls:'sm'};
        steps.push({kind:'carry',cells:[cid],exp:String(c.out),prompt:`Quanto "vai" para a próxima coluna? Do ${c.t}, o ${c.dg} fica e o resto sobe.`,short:`vai-um?`,ok:`Vai ${c.out} para cima da próxima coluna`,help1:`${c.t} tem quantas dezenas inteiras? Elas é que "vão".`,help2:`${c.t} = ${c.out} dezena(s) e ${c.dg} unidade(s). As dezenas vão para a coluna do lado: <b>${c.out}</b>.`});}
      if(c.last&&c.out>0){const lid=`m${p.j}_${i}L`;r.cells[col-1]={k:'in',id:lid};
        steps.push({kind:'lead',cells:[lid],exp:String(c.out),prompt:`Agora escreva a dezena do ${c.t}, ao lado.`,short:`dezena do ${c.t}?`,ok:`${c.t}: ${c.out} dezena(s) e ${c.dg} unidade(s)`,help1:`O número ${c.t} tem dois algarismos. Já escrevemos o da direita.`,help2:`${c.t} = <b>${c.out}</b>${c.dg}. Escreva o ${c.out} ao lado do ${c.dg}.`});}
    });}

      steps.push({kind:'sum',cells:[id],exp:String(dg),prompt:`Some a coluna: ${expr}.${out>0&&s<tl-1?' Escreva a unidade; o resto "vai".':''}`,short:`${expr} = ?`,ok:`${expr} = ${t}`+(out>0&&s<tl-1?` → escreve ${dg}, vai ${out}`:''),help1:`Some com calma: ${terms.join(' + ')}${c?' e depois o vai-um '+c:''}.`,help2:`<b>${expr} = ${t}</b>. Escreva <b>${dg}</b>${out>0&&s<tl-1?` e "vai" ${out}`:''}.`});

      c=out;}
    if(!any)rows.splice(rows.indexOf(scar),1);}
  return{type:'v',rows,steps,answer:total,W};}

/* ---- divisão pela chave (método tradicional) ---- */
function buildDiv(D,d){
  const dd=digs(D),n=dd.length;let pos0=0,cur=dd[0];
  if(cur<d&&n>1){pos0=1;cur=dd[0]*10+dd[1];}

  const r0=mkr();dd.forEach((x,i)=>r0[i+1]={k:'fixed',v:x});
  let rem=0;const nS=n-pos0;
  for(let k=0;k<nS;k++){
    const pos=pos0+k;if(k>0)cur=rem*10+dd[pos];
    const q=Math.floor(cur/d),p=q*d,r=cur-p,pr=mkr(),rr=mkr(),pc=pos+1,ps=String(p),rs=String(r);
    pr[pc-ps.length]={k:'sign',v:'−'};
    const pids=[...ps].map((_,t)=>`p${k}_${t}`);pids.forEach((id,t)=>pr[pc-ps.length+1+t]={k:'in',id});
    const rids=[...rs].map((_,t)=>`r${k}_${t}`);rids.forEach((id,t)=>rr[pc-rs.length+1+t]={k:'in',id});
    quot.push({k:'in',id:`q${k}`});

    const first=k===0?(pos0===1?`Como o ${dd[0]} é menor que ${d}, usamos os dois primeiros algarismos: ${cur}. `:''):`Agora temos ${cur}. `;
    steps.push({kind:'q',cells:[`q${k}`],exp:String(q),prompt:`${first}Quantas vezes o ${d} cabe em ${cur}?`,short:`${cur} ÷ ${d} → quociente?`,
      ok:q===0?`${d} não cabe em ${cur}: 0 vezes`:`${d} × ${q} = ${p} cabe em ${cur}`,
      help1:q===0?`${d} é maior que ${cur}, então cabe 0 vezes.`:`Tabuada do ${d}: ${ml.join(', ')}. O maior que não passa de ${cur} é ${p}.`,
      help2:q===0?`${d} é maior que ${cur}, por isso cabe <b>0</b> vezes.`:`<b>${d} × ${q} = ${p}</b> cabe em ${cur}, mas <b>${d} × ${q+1} = ${d*(q+1)}</b> já passa de ${cur}. O quociente é <b>${q}</b>.`,
      vis:{type:'groups',total:cur,size:d}});
